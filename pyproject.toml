[project]
name = "ndm-checkindesk"
version = "0.1.0"
description = "NdM CheckInDesk"
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
  "fastapi>=0.165.0",
  "uvicorn>=0.54.0",
  "jinja2>=3.1.6",
  "python-multipart>=0.0.34",
  "PyYAML>=6.0.3",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.1.1",
  "pytest-cov",
  "ruff>=0.16.6",
  "httpx2>=2.16.2",
  "black>=26.5.1",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.black]
target-version = ["py310"]

[tool.ruff]
target-version = "py310"
